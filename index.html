<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator">

        <div class="display">
            <div id="previous-display"></div>
            <div id="current-display">0</div>
        </div>

        <div class="buttons">

            <button class="span-two" data-action="clear">AC</button>
            <button data-action="delete">⌫</button>
            <button class="operator" data-operation="/">÷</button>

            <button class="number">7</button>
            <button class="number">8</button>
            <button class="number">9</button>
            <button class="operator" data-operation="*">×</button>

            <button class="number">4</button>
            <button class="number">5</button>
            <button class="number">6</button>
            <button class="operator" data-operation="-">−</button>

            <button class="number">1</button>
            <button class="number">2</button>
            <button class="number">3</button>
            <button class="operator" data-operation="+">+</button>

            <button class="number span-two">0</button>
            <button class="number">.</button>
            <button class="equals" data-action="calculate">=</button>

        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
